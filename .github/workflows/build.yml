name: Build TADaManager APK

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Determine Build Task
        id: determine_task
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ] && [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > app/keystore.jks
            echo "task=assembleRelease" >> $GITHUB_OUTPUT
            echo "apk_path=app/build/outputs/apk/release/*.apk" >> $GITHUB_OUTPUT
          else
            echo "task=assembleDebug" >> $GITHUB_OUTPUT
            echo "apk_path=app/build/outputs/apk/debug/*.apk" >> $GITHUB_OUTPUT
          fi

      - name: Build TADaManager APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ENTRY_ALIAS: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
          _JAVA_OPTIONS: "-Djava.awt.headless=true"
        run: |
          ./gradlew ${{ steps.determine_task.outputs.task }} -PsignAsDebug --stacktrace

      - name: Upload TADaManager APK
        uses: actions/upload-artifact@v4
        with:
          name: TADaManager-APK
          path: ${{ steps.determine_task.outputs.apk_path }}
          if-no-files-found: error
